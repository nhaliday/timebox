[tool.poetry]
name = "timebox"
version = "0.5.0"
description = "Menu bar utility app (macOS) adding timeboxing functionality to Things 3."
authors = ["Camillo Visini <c.visini@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
rumps = "^0.4.0"
pyobjc-core = "^12.2"
pyobjc-framework-cocoa = "^12.2"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "setuptools (>=82.0.1,<83.0.0)",
    "py2app (>=0.28.10,<0.29.0)"
]
